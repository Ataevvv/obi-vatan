<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Оби Ватан — Водитель</title>
  <link rel="stylesheet" href="driver.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>

<!-- ВЫБОР ВОДИТЕЛЯ -->
<div class="select-screen" id="selectScreen">
  <div class="select-card">
    <img src="logo.png" alt="Оби Ватан" class="sel-logo"/>
    <h2>Войти</h2>
    <p>Выберите имя и введите PIN</p>
    <div class="driver-btns" id="driverBtns">
      <button onclick="pickDriver('Алишер', this)">🚗 Алишер</button>
      <button onclick="pickDriver('Бахром', this)">🚙 Бахром</button>
      <button onclick="pickDriver('Санжар', this)">🛻 Санжар</button>
      <button onclick="pickDriver('Достон', this)">🚐 Достон</button>
    </div>
    <div class="pin-section" id="pinSection" style="display:none">
      <div class="pin-label" id="pinLabel"></div>
      <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="4" placeholder="• • • •" autocomplete="off"/>
      <div class="pin-error" id="pinError"></div>
      <div class="pin-actions">
        <button class="btn-pin-back" onclick="backToSelect()">← Назад</button>
        <button class="btn-pin-ok" onclick="checkPin()">Войти</button>
      </div>
    </div>
  </div>
</div>

<!-- ЗАКАЗЫ ВОДИТЕЛЯ -->
<div class="driver-app" id="driverApp" style="display:none">

  <header class="dr-header">
    <div class="dr-header-left">
      <img src="logo.png" alt="" class="dr-logo"/>
      <div>
        <div class="dr-name" id="driverName"></div>
        <div class="dr-status"><span class="dr-dot"></span>Онлайн</div>
      </div>
    </div>
    <button class="dr-change" onclick="changeDriver()">Сменить</button>
  </header>

  <div class="dr-main" id="drMain">
    <div class="dr-loading">Загрузка...</div>
  </div>

</div>

<script src="driver.js"></script>
</body>
</html>
